# Cabeceras HTTP de seguridad — las sirve AWS Amplify en cada respuesta.
#
# ⛔ Amplify lee ESTE archivo. NO lee `_headers` (eso es Netlify / Cloudflare Pages).
#    El repo tenía un `_headers` con estas mismas cabeceras bien escritas desde el commit
#    a2e4cb8 y NUNCA sirvió ninguna: formato equivocado y, además, en la raíz en vez de
#    en `public/`, así que ni siquiera llegaba a `dist/`. Medido el 2026-08-06:
#    `curl -sI https://www.wasvelt.com` devolvía 0 de 6 cabeceras. Ese archivo se retira
#    en este mismo commit para que no vuelva a dar sensación de cobertura.
#
#    Verificar SIEMPRE por el receptor, no por el repo:
#      curl -sI https://www.wasvelt.com | grep -iE 'strict-transport|content-security|x-frame'
#
# Notas de diseño (2026-08-06):
#  - HSTS sin `includeSubDomains` y sin `preload` a propósito: no está verificado que
#    todos los subdominios sirvan HTTPS, y `preload` es irreversible en la práctica.
#  - El CSP va en Report-Only: reporta en consola pero NO bloquea. Se observa en
#    producción y sólo entonces se pasa a vinculante renombrando la clave a
#    `Content-Security-Policy`.
#  - Permissions-Policy deniega lo sensible pero permite a Vimeo autoplay y fullscreen:
#    los vídeos de fondo de la-empresa/fabricacion usan `autoplay=1&muted=1`.

customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Permissions-Policy'
        value: 'accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=(), autoplay=(self "https://player.vimeo.com"), fullscreen=(self "https://player.vimeo.com")'
      # Inventario de terceros medido el 2026-08-06 sobre src/ y public/:
      #   frame-src   player.vimeo.com  (5 vídeos: la-empresa ×3, fabricacion ×2, proyectos)
      #               www.google.com    (2 iframes de Google Maps en la-empresa)
      #   font-src    'self' data: — `@fontsource/lato` es autohospedada, pero el bundler la
      #               EMBEBE como `url(data:font/woff;base64,…)` en el CSS. Medido en
      #               produccion el 2026-08-10 con el CSP ya en Report-Only: sin `data:` el
      #               navegador reportaba violacion en cada @font-face de Lato y, de haber
      #               sido vinculante, el sitio se habria quedado sin tipografia.
      #   sin <script src> ni <link href> a terceros
      - key: 'Content-Security-Policy-Report-Only'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://player.vimeo.com https://www.google.com; form-action 'self'"
